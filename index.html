<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מחשבון פיננסי Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; -webkit-tap-highlight-color: transparent; }
        .solve-btn { transition: all 0.2s ease; }
        .solve-btn:active { transform: scale(0.95); }
        /* מונע בחירה של טקסט בטעות בלחיצה מהירה */
        input { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <div class="bg-slate-900 text-white p-6 text-center shadow-lg mb-4">
        <h1 class="text-2xl font-extrabold tracking-tight italic">מחשבון פיננסי <span class="text-blue-400">PRO</span></h1>
        
        <div class="mt-4 flex justify-center gap-2">
            <select id="period-type" onchange="updateLabels()" class="bg-slate-800 text-white text-sm rounded-lg px-3 py-1 border border-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                <option value="חודשים">חישוב חודשי</option>
                <option value="רבעונים">חישוב רבעוני</option>
                <option value="שנים">חישוב שנתי</option>
            </select>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4">
        <div class="bg-white rounded-3xl shadow-xl p-6 space-y-4 border border-slate-100">
            
            <div class="relative">
                <label id="label-n" class="block text-xs font-bold text-slate-500 mb-1 mr-1 uppercase">מספר חודשים (N)</label>
                <div class="flex gap-2">
                    <input id="n" type="text" inputmode="text" placeholder="0" class="w-full bg-slate-50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold transition tracking-wider">
                    <button onclick="calculate('n')" class="solve-btn bg-blue-600 hover:bg-blue-700 text-white w-14 rounded-2xl flex items-center justify-center shadow-md text-xl">🔍</button>
                </div>
            </div>

            <div class="relative">
                <label id="label-i" class="block text-xs font-bold text-slate-500 mb-1 mr-1 uppercase">ריבית חודשית (%)</label>
                <div class="flex gap-2">
                    <input id="i" type="text" inputmode="text" placeholder="0.00" class="w-full bg-slate-50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold transition text-orange-600 tracking-wider">
                    <button onclick="calculate('i')" class="solve-btn bg-blue-600 hover:bg-blue-700 text-white w-14 rounded-2xl flex items-center justify-center shadow-md text-xl">🔍</button>
                </div>
            </div>

            <div class="relative">
                <label class="block text-xs font-bold text-slate-500 mb-1 mr-1 uppercase">ערך נוכחי (PV)</label>
                <div class="flex gap-2">
                    <input id="pv" type="text" inputmode="text" placeholder="0" class="w-full bg-slate-50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold transition text-emerald-600 tracking-wider">
                    <button onclick="calculate('pv')" class="solve-btn bg-blue-600 hover:bg-blue-700 text-white w-14 rounded-2xl flex items-center justify-center shadow-md text-xl">🔍</button>
                </div>
            </div>

            <div class="relative">
                <label id="label-pmt" class="block text-xs font-bold text-slate-500 mb-1 mr-1 uppercase">תשלום חודשי (PMT)</label>
                <div class="flex gap-2">
                    <input id="pmt" type="text" inputmode="text" placeholder="0" class="w-full bg-slate-50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold transition text-slate-700 tracking-wider">
                    <button onclick="calculate('pmt')" class="solve-btn bg-blue-600 hover:bg-blue-700 text-white w-14 rounded-2xl flex items-center justify-center shadow-md text-xl">🔍</button>
                </div>
            </div>

            <div class="relative">
                <label class="block text-xs font-bold text-slate-500 mb-1 mr-1 uppercase">ערך עתידי (FV)</label>
                <div class="flex gap-2">
                    <input id="fv" type="text" inputmode="text" placeholder="0" class="w-full bg-slate-50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold transition text-blue-600 tracking-wider">
                    <button onclick="calculate('fv')" class="solve-btn bg-blue-600 hover:bg-blue-700 text-white w-14 rounded-2xl flex items-center justify-center shadow-md text-xl">🔍</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="shareWhatsApp()" class="bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-2xl font-bold text-sm shadow-md transition flex items-center justify-center gap-1">
                    <span>שתף בוואטסאפ</span>
                </button>
                <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white py-3 rounded-2xl font-bold text-sm shadow-md transition">PDF / הדפסה</button>
            </div>
            
            <button onclick="clearFields()" class="w-full text-slate-400 py-2 text-[10px] uppercase font-bold tracking-widest mt-2 border border-slate-100 rounded-xl">איפוס נתונים</button>
        </div>
        
        <p class="text-center text-[10px] text-slate-400 mt-4 leading-tight italic">
            * הערה: הזן מספרים חיוביים ושליליים בהתאם לכיוון התזרים.<br>
            (לדוגמה: הלוואה בסימן +, החזרים בסימן -)
        </p>
    </div>

    <script>
        function updateLabels() {
            const type = document.getElementById('period-type').value;
            const singular = type === 'חודשים' ? 'חודשי' : (type === 'רבעונים' ? 'רבעוני' : 'שנתי');
            const term = type === 'חודשים' ? 'חודשים' : (type === 'רבעונים' ? 'רבעונים' : 'שנים');
            document.getElementById('label-n').innerText = `מספר ${term} (N)`;
            document.getElementById('label-i').innerText = `ריבית ${singular} (%)`;
            document.getElementById('label-pmt').innerText = `תשלום ${singular} (PMT)`;
        }

        function formatNumber(val) {
            if (val === "" || isNaN(val)) return "";
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 }).format(val);
        }

        function parseNumber(str) {
            if (!str) return 0;
            return parseFloat(str.toString().replace(/,/g, '')) || 0;
        }

        // הגדרת מאזינים המאפשרים מינוס ופסיקים
        ['n','i','pv','pmt','fv'].forEach(id => {
            const el = document.getElementById(id);
            
            // בעת יציאה מהשדה - מעצבים עם פסיקים
            el.addEventListener('blur', (e) => {
                const raw = e.target.value;
                if (raw === "-" || raw === "") return;
                const val = parseNumber(raw);
                if (id !== 'i' && id !== 'n') e.target.value = formatNumber(val);
            });

            // בעת כניסה לשדה - מנקים פסיקים כדי לאפשר עריכה
            el.addEventListener('focus', (e) => {
                e.target.value = e.target.value.replace(/,/g, '');
            });

            // חסימת תווים לא רלוונטיים (מאפשר רק מספרים, נקודה ומינוס)
            el.addEventListener('input', (e) => {
                let val = e.target.value;
                // מאפשר רק מינוס אחד בהתחלה, נקודה אחת, ומספרים
                e.target.value = val.replace(/[^0-9.-]/g, '').replace(/(\..*)\./g, '$1').replace(/(?!^)-/g, '');
            });
        });

        function calculate(target) {
            const n = parseNumber(document.getElementById('n').value);
            const i = parseNumber(document.getElementById('i').value) / 100;
            const pv = parseNumber(document.getElementById('pv').value);
            const pmt = parseNumber(document.getElementById('pmt').value);
            const fv = parseNumber(document.getElementById('fv').value);

            try {
                if (target === 'fv') {
                    let res = - (pv * Math.pow(1 + i, n) + pmt * (Math.pow(1 + i, n) - 1) / i);
                    if (i === 0) res = -(pv + pmt * n);
                    document.getElementById('fv').value = formatNumber(res);
                } 
                else if (target === 'pv') {
                    let res = - (fv / Math.pow(1 + i, n) + pmt * (1 - Math.pow(1 + i, -n)) / i);
                    if (i === 0) res = -(fv + pmt * n);
                    document.getElementById('pv').value = formatNumber(res);
                }
                else if (target === 'pmt') {
                    let res = - (fv + pv * Math.pow(1 + i, n)) / ((Math.pow(1 + i, n) - 1) / i);
                    if (i === 0) res = -(fv + pv) / n;
                    document.getElementById('pmt').value = formatNumber(res);
                }
                else if (target === 'n') {
                    let res = Math.log((pmt - fv * i) / (pmt + pv * i)) / Math.log(1 + i);
                    document.getElementById('n').value = res.toFixed(2);
                }
                else if (target === 'i') {
                    let r = 0.1; 
                    for (let j = 0; j < 100; j++) {
                        let r1 = r + 0.00001;
                        let f_r = pv * Math.pow(1+r, n) + pmt * (Math.pow(1+r, n) - 1) / r + fv;
                        let f_r1 = pv * Math.pow(1+r1, n) + pmt * (Math.pow(1+r1, n) - 1) / r1 + fv;
                        let derivative = (f_r1 - f_r) / 0.00001;
                        r = r - f_r / derivative;
                    }
                    document.getElementById('i').value = (r * 100).toFixed(4);
                }
            } catch (e) { alert("וודא שהנתונים תקינים"); }
        }

        function shareWhatsApp() {
            const type = document.getElementById('period-type').value;
            const msg = `*סיכום חישוב פיננסי (${type})*%0A-----------------%0Aתקופות: ${document.getElementById('n').value}%0Aריבית: ${document.getElementById('i').value}%%0Aערך נוכחי: ${document.getElementById('pv').value}%0Aתשלום: ${document.getElementById('pmt').value}%0Aערך עתידי: ${document.getElementById('fv').value}`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        function clearFields() {
            ['n','i','pv','pmt','fv'].forEach(id => document.getElementById(id).value = '');
        }
    </script>
</body>
</html>
